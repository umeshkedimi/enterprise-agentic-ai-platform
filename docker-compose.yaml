services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eaap
      POSTGRES_PASSWORD: eaap
      POSTGRES_DB: eaap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaap -d eaap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://eaap:eaap@postgres:5432/eaap
      DATABASE_URL_SYNC: postgresql+psycopg://eaap:eaap@postgres:5432/eaap
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Observability -------------------------------------------------------
  #
  # Behind a profile, so `docker compose up -d postgres redis` — the command
  # every other workflow in this repo starts with — does not also start three
  # services nobody asked for. Bring the stack up with:
  #
  #     docker compose --profile observability up -d
  #
  # There is deliberately no OpenTelemetry Collector here. In production a
  # collector is the right answer — it buffers, re-routes, and lets the app stay
  # ignorant of where telemetry ends up — but locally it is a hop between a
  # process and a backend that is already listening on the same protocol, and a
  # config file whose only job is to forward.

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Jaeger takes OTLP directly and ships its own UI, so the traces this platform
  # emits are viewable without a collector, a storage backend, or a query
  # service in between.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP — what OTEL_EXPORTER_OTLP_ENDPOINT points at

  grafana:
    image: grafana/grafana:11.5.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
