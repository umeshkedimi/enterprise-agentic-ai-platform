[project]
name = "enterprise-agentic-ai-platform"
version = "0.1.0"
description = "Enterprise Agentic AI Platform — multi-agent platform backend"
authors = [
    { name = "Umesh", email = "umesh836@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.3",
    "redis>=5.2.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.13",
    "openai>=1.57.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.17",
    "tiktoken>=0.8.0",
    "litellm>=1.93.0",
    "mcp>=2.0.0",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across the whole session. The app's async engine is a
# module-level singleton whose pooled connections bind to the loop that created
# them; a fresh loop per test would inherit a dead connection ("Event loop is
# closed"). One session-scoped loop keeps the engine and the tests in step.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately evaluates these in argument
# defaults; the call result is a marker object, not shared mutable state, so
# B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
